# ===============================================
#  監視する商品リスト(ここだけ自分で編集します)
# ===============================================
# 商品を追加するには:
#   1. GitHubの「Actions」→「商品候補を探す」でキーワード検索
#   2. 結果に出た itemCode をコピーして、下の items に追記
#
# 各項目の意味:
#   code     : 楽天の商品コード(必須)「ショップ名:商品ID」の形
#   name     : 投稿で使う短い商品名(必須・30文字くらいまで)
#   target   : 一人暮らし / 家族 / 共通
#   category : ページでのグループ分け(自由に命名)
#   comment  : おすすめ理由を一言(ページに載ります。自分の言葉で!)
#   pain     : 悩みの場面と問いかけ(本投稿。リンクなしで流れます)
#              誰が・いつ・どこで・何に困って・今どうごまかしているか、を具体的に
#   solution : なぜこの商品でその悩みが解決するのか(返信に価格・リンクと一緒に載ります)
#   threshold: (任意)何%下がったら投稿するか。省略時は下の settings の値
#
# pain と solution を両方書くと「本投稿(悩み)→ 返信(解決策+【PR】リンク)」の2段構成で投稿します。
# どちらかが空なら、これまでどおり1投稿(【PR】+価格+リンク)で投稿します。
# 使っていない商品を「使ってみたら最高だった」と体験談風に書かないこと。

settings:
  drop_threshold: 15        # 30日間の通常価格から何%下がったら「買い時」とするか
  min_history_days: 5       # 判定を始めるまでに必要な価格記録の日数
  repost_cooldown_days: 7   # 同じ商品を再投稿しない日数(さらに5%以上下がれば例外)
  max_posts_per_run: 2      # 1回の実行で投稿する最大件数
  account_name: "osatow37"

items:
  # ↓記入例(実在の商品コードに置き換えてから # を外してください)
  # - code: "shopname:10000123"
  #   name: "アイリスオーヤマ 電気ケトル 1.0L"
  #   target: 一人暮らし
  #   category: キッチン家電
  #   comment: "沸騰が速くて手入れも簡単。最初の1台に"
  #   pain: |
  #     朝、温かいスープを飲みたいのに、やかんで沸かす4分が待てなくて、結局何も飲まずに家を出る。
  #     コンロの前でスマホを見ている時間がいちばんもったいない。
  #     こういう朝、ありませんか?
  #   solution: |
  #     電気ケトルならカップ1杯分が1分ちょっと。スイッチを入れて着替えている間に沸きます。
  #     火を使わないので、沸くまでその場を離れられるのが大きいです。

  # ---------------------------------------------------------------
  # テーマ: 一人暮らし × 収納が少ない × 掃除をラクに × 見た目
  # 「しまう場所がない → 出しっぱなしになる → だから見た目が大事
  #   → 出しっぱなしだから気づいたときにすぐ掃除できる」という流れでつなげています。
  # pain / solution は下書きです。自分の実感と違うところは書き換えてください。
  # 商品の仕様(重さ・自立するか・対応機種など)は、投稿前に商品ページで確認すること。
  # ---------------------------------------------------------------

  - code: "roomy:10016466"
    name: "±0 コードレス掃除機 B021"
    target: 一人暮らし
    category: 掃除
    comment: "出しっぱなしでも部屋になじむ見た目のコードレス"
    pain: |
      ワンルームで掃除機をしまう場所がなくて、クローゼットの奥に押し込んでいる。
      出すたびに扉を開けて、服をよけて、引っぱり出す。
      それが面倒で、床の髪の毛が気になっても「週末でいいか」が続く。
      掃除が嫌いなんじゃなくて、出すのが面倒なだけ。そういうこと、ありませんか?
    solution: |
      掃除機は「しまう」のをやめて、出しっぱなしにできる見た目のものを選ぶと、気づいたときに5分だけかけられるようになります。
      プラスマイナスゼロのコードレスは家電っぽさが少ないデザインなので、ワンルームの目に入る場所に置いても浮きにくいです。

  - code: "roomy:10015762"
    name: "レコルト コードレス 3wayクリーナー"
    target: 一人暮らし
    category: 掃除
    comment: "床・机の上・すき間を1台で。見た目もかわいい"
    pain: |
      机の上の消しカス、キーボードのすき間のほこり、玄関の砂。
      掃除機を出すほどじゃないけど、気になる汚れが毎日ちょっとずつある。
      結局ティッシュでつまんだり、手で払ったりしてごまかしている。
      こういう小さい汚れ、どうしていますか?
    solution: |
      スティック・ハンディ・ブロワーの3通りに使えるタイプなら、床も机の上もキーボードのすき間も1台で済みます。
      掃除機を何台も置くスペースがない一人暮らしには、1台で用途が広いのがいちばん効きます。

  - code: "yamayuu:10016371"
    name: "山崎実業 スティッククリーナースタンド tower"
    target: 一人暮らし
    category: 収納
    comment: "掃除機の定位置を作るだけで、出し入れが1秒に"
    pain: |
      スティック掃除機、壁に立てかけておくと倒れるし、床に寝かせるとまたいで歩くことになる。
      置き場所が決まっていないから、使い終わるたびに「どこに置こう」で止まる。
      掃除機の置き場所、地味に困っていませんか?
    solution: |
      専用のスタンドに立てておけば倒れないし、床に寝かせずに済みます。
      置き場所が決まると、使ったあと戻すのも、また使うときに取るのも一瞬です。
      tower シリーズは白・黒のシンプルな見た目なので、部屋に出しておいても目立ちません。
      対応する掃除機は商品ページで確認してください。

  - code: "anker:10002285"
    name: "Anker Eufy ロボット掃除機 C10"
    target: 一人暮らし
    category: 掃除
    comment: "超薄型でベッド下にも。ゴミも自動で集めてくれる"
    pain: |
      仕事から帰ると、床に髪の毛とほこりが見える。
      でも疲れていて、掃除機をかける気力が残っていない。
      見なかったことにして寝る日が、週に何回もある。
      平日に掃除する元気、ありますか?
    solution: |
      ロボット掃除機なら、出かけている間に床を一周してくれます。
      帰ってきたときに床がきれいなだけで、部屋で過ごす気分がかなり変わります。
      Eufy C10 は超薄型なので、ベッドやソファの下にも入りやすく、ゴミを自動で集めるタイプなのでゴミ捨ての手間も減ります。

  - code: "ueno-mono:10000006"
    name: "UENO-mono コードレス ハンディクリーナー"
    target: 一人暮らし
    category: 掃除
    comment: "気づいた瞬間に10秒で終わる、手元の1台"
    pain: |
      ご飯を食べたあと、テーブルの下にこぼれたパンくず。
      気づいているけど、掃除機を出すほどでもなくて、そのまま次の日に踏む。
      小さい汚れほど後回しになりませんか?
    solution: |
      手の届く場所にハンディクリーナーを1台置いておくと、気づいた瞬間に10秒で終わります。
      大きい掃除機を出す気にならない小さい汚れこそ、すぐ手に取れることがいちばん大事です。
