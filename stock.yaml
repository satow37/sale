# ===============================================
#  悩みだけの投稿ストック(リンクなし・セールでない日に流れます)
# ===============================================
# 毎日21時ごろ、上から順にまだ投稿していないものを1本投稿します。
# その日にセール投稿があった日はお休みします。
# 全部投稿し終わると止まるので、こまめに書き足してください。
#
# 書き方: 誰が・いつ・どこで・何に困って・今どうごまかしているか、を具体的に。
# 最後は「こういうこと、ありませんか?」のような問いかけで終えると反応が来やすいです。
# 一度投稿したものは文章を変えると「未投稿」扱いに戻るので注意。
# 500文字まで。

posts:
  # 新婚・2LDK・夫婦それぞれ自分の部屋(ふたりとも布団)の前提で書いています。
  # 体験として書いてよいことは ../CLAUDE.md の「運営者の実際の暮らし」を参照。
  # 口調は です・ます の話し言葉。パートナーは「つま」。

  - text: |
      新婚で2LDKに住んでいて、つまとわたしはそれぞれ自分の部屋があります。

      自分の部屋があるのはうれしいんですけど、いざそろえようとすると、何から買えばいいのか全然決まらないんですよね。
      机、収納、照明、カーテン。
      どれも「とりあえず」で買うと、あとで部屋の雰囲気に合わなくなりそうで。

      一人一部屋の人、自分の部屋に最初に買ったものって何でしたか?
      よかったらコメントで教えてください。

  - text: |
      うちは夫婦それぞれ自分の部屋があって、ふたりとも布団で寝ています。

      部屋を広く見せたかったんです。
      朝たためば、昼間は床を広く使えます。

      ベッド派と布団派、みなさんはどっちですか?

  - text: |
      うちはロボット掃除機を使っているので、床にはものを置いていません。
      部屋に置いてあるのは、たたんだ布団くらいです。

      床にものがなければ、ロボットが一周するだけで床の掃除は済むんですよね。

      ロボット掃除機を使っている人、床のもの問題どうしていますか?

  - text: |
      掃除は、週末にまとめてやるより、気づいたときに少しずつやっています。

      床はロボット掃除機に任せて、それ以外は気づいたときにちょっとだけ。
      そのくらいがいちばん続いています。

      みなさんはまとめて派ですか? 少しずつ派ですか?

  - text: |
      新婚で2LDKに住んでいて、一人一部屋にしています。

      夫婦で部屋を分けるかどうかって、けっこう意見が分かれるところだと思うんです。
      一緒の部屋がいい人もいれば、自分の部屋がほしい人もいる。
      うちは、自分の部屋はそれぞれ好きにしています。

      夫婦や同棲の人、部屋は分けていますか? 一緒ですか?

  - text: |
      おしゃれな部屋にしたいなら、高い家具を買わなくてもいいと思っています。

      色を白か黒にそろえるだけで、部屋はかなりすっきり見えるんですよね。
      ごちゃっとして見えるのは、ものの多さより色の多さだったりします。

      部屋の色、みなさんは何色でそろえていますか?

  - text: |
      うちの部屋はクローゼットが各部屋に1つずつです。
      夫婦それぞれ自分のクローゼットがあるのは助かるんですけど、布団で寝ていると、布団をしまう場所もそこから取ることになります。

      季節外の布団と服をどうしまうかは、けっこう考えました。

      布団で寝ている人、使わない季節の布団ってどこにしまっていますか?
