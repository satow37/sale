name: 悩み投稿

on:
  schedule:
    # 日本時間 21:03(UTCで指定)
    - cron: "3 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "テストモード(投稿しない)"
        type: boolean
        default: true

permissions:
  contents: write

# 価格チェックと同じグループにして、data/ への書き込みがぶつからないようにする
concurrency:
  group: check
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 悩み投稿
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # 手動実行は入力値、定期実行はリポジトリ変数 LIVE_MODE が true のときだけ本番投稿
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || (vars.LIVE_MODE == 'true' && 'false' || 'true') }}
        run: python scripts/post_stock.py
      - name: 記録を保存
        run: |
          git config user.name "sale-bot"
          git config user.email "sale-bot@users.noreply.github.com"
          mkdir -p data
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "悩み投稿 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
