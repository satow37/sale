name: 投稿候補の承認

# 投稿候補のIssueに、リポジトリの持ち主が OK / NG とコメントしたときだけ動く
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.body, 'sale-proposal') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 投稿または見送り
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python scripts/approve.py
      - name: 記録を保存
        if: always()
        run: |
          git config user.name "sale-bot"
          git config user.email "sale-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "投稿候補の処理 #${{ github.event.issue.number }}"
            git pull --rebase
            git push
          fi
