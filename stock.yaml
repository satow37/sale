# ===============================================
#  悩みだけの投稿ストック(リンクなし・セールでない日に流れます)
# ===============================================
# 毎日21時ごろ、上から順にまだ投稿していないものを1本投稿します。
# その日にセール投稿があった日はお休みします。
# 全部投稿し終わると止まるので、こまめに書き足してください。
#
# 書き方: 誰が・いつ・どこで・何に困って・今どうごまかしているか、を具体的に。
# 最後は「こういうこと、ありませんか?」のような問いかけで終えると反応が来やすいです。
# 一度投稿したものは文章を変えると「未投稿」扱いに戻るので注意。
# 500文字まで。

posts:
  # ↓記入例(# を外すと投稿対象になります)
  # - text: |
  #     洗濯物を夜に干して、朝まだ湿ってる。
  #     部屋干しのにおいが気になって、結局もう一回洗濯機を回す。
  #     一人暮らしの洗濯、地味にこれがいちばんしんどい。
  #     同じ人いますか?

  # ---------------------------------------------------------------
  # 一人暮らし × 服と布団の置き場がない × 掃除は気づいたときに少しずつ × シンプル・色をそろえる
  # ---------------------------------------------------------------

  - text: |
      一人暮らしの部屋、収納がクローゼット1つしかない。
      季節外の服と布団で、もう半分が埋まっている。
      残りの半分に、今着る服を全部入れるのは無理がある。
      同じ人いますか?

  - text: |
      冬用の布団を出した日、今度は夏用の布団の行き場がない。
      布団って、使っていないときのほうが場所を取る。

  - text: |
      部屋を片付けても、3日で元に戻る。
      片付けが苦手なんじゃなくて、ものの置き場所が決まっていないだけかもしれない。
      しまう場所がないものは、結局床か椅子の上に戻ってくる。

  - text: |
      掃除は、週末にまとめてやるより、気づいたときに少しずつのほうが続く。
      まとめてやろうとすると腰が重くなって、結局やらない。
      「ついでに30秒」くらいがちょうどいい。
      みんなはまとめて派? 少しずつ派?

  - text: |
      おしゃれな部屋にしたいなら、高い家具を買わなくてもいい。
      色を白か黒にそろえるだけで、部屋はかなりすっきり見える。
      ごちゃっとして見える原因は、ものの多さより色の多さだったりする。

  - text: |
      ワンルームだと、出しっぱなしのものは全部インテリアの一部になる。
      隠す場所がないから、家電も収納もシンプルな見た目のものを選ぶようにしている。
      狭い部屋ほど、ものの見た目って大事じゃないですか?

  - text: |
      ロボット掃除機を使うなら、床にものを置かないのがいちばん大事。
      ロボットが通れるように片付けることが、そのまま片付けの習慣になる。
      ロボット掃除機、床のもの問題どうしていますか?

  - text: |
      一人暮らしの部屋、ベッドをやめて布団にしている。
      たたんでしまえば、昼間は床を全部使える。
      ワンルームだと、ベッド1台分の床がそのまま部屋の広さになる。
      ベッド派ですか? 布団派ですか?

  - text: |
      収納はクローゼット1つ。それでも服と布団はなんとか収まっている。
      やっていることは、季節外のものを圧縮袋に入れることと、ハンガーで掛けて収納すること。
      特別な収納家具がなくても、かさを減らすだけでけっこう入る。
