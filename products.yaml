  # ---------------------------------------------------------------
  # テーマ: 新婚・2LDK・夫婦それぞれ自分の部屋(ふたりとも布団)
  #         × 服と布団の収納 × 床にものを置かない × ロボット掃除機と少しずつの掃除
  # 体験として書いてよいことは ../CLAUDE.md の「運営者の実際の暮らし」を参照。
  # 口調は です・ます の話し言葉。パートナーは「つま」。
  # ---------------------------------------------------------------

  - code: "aquatalk:10000217"
    name: "日本製 布団圧縮袋 マチ付き"
    target: 自分の部屋
    category: 収納
    comment: |
      季節外の布団や服を小さくしまえる圧縮袋です。
      日本製でマチ付きなので、厚めの掛け布団も入れやすいです。
      空気は掃除機(300W以上)で抜くタイプです。
    story: |
      新婚で2LDKに住んでいて、つまとわたしはそれぞれ自分の部屋があります。
      そしてふたりとも、ベッドじゃなくて布団です。

      部屋を広く見せたかったんですよね。
      でも布団にすると、今度は布団をしまう場所がいります。
      クローゼットは各部屋に1つずつ。
      そこに夏用と冬用の布団と、季節外の服まで入れるとなると、どう考えても入りきらない量でした。

      収納ケースを買い足すことも考えました。
      でもケースを置いたら、そのぶん部屋が狭くなります。
      広く見せたくて布団にしたのに、それじゃ意味がないなと。

      それでやったのは、季節外の服と布団を圧縮袋に入れることと、今着る服はたたまずにハンガーに掛けること。この2つだけです。

      圧縮袋は掃除機で空気を抜くだけで、ふかふかの布団がぺたんこになります。
      空いたところに、今着る服がちゃんと入るようになりました。
      いまは部屋の床に置いてあるのも、たたんだ布団くらいです。

      布団で寝ている人、季節外の布団ってどこにしまっていますか?
      よかったらコメントで教えてください。

  - code: "rackworld:10000627"
    name: "メタルラック ハンガーラック 幅91cm"
    target: 自分の部屋
    category: 収納
    comment: "白・黒・ブラウンから選べる、シンプルなスチールのハンガーラック"
    pain: |
      クローゼットに入りきらない服って、気づいたら椅子の背もたれにかかっていませんか?
      「とりあえず」のつもりが、そのまま椅子が服置き場になっていく。
      みなさん、入りきらない服はどうしていますか?
    solution: |
      クローゼットに入らない分は、見せる収納にしてしまうのが早いと思います。
      ハンガーラックに、服の色をそろえて掛けるだけでも散らかって見えにくいです。
      このラックはスチールのシンプルな形で、白・黒・ブラウンから選べるので、自分の部屋の雰囲気に合わせやすいです。

  - code: "anker:10002285"
    name: "Anker Eufy ロボット掃除機 C10"
    target: ふたり暮らし
    category: 掃除
    comment: "高さ7.2cmの薄型で、ゴミを自動で集めるステーション付き"
    pain: |
      うちはロボット掃除機を使っていて、床にはものを置いていません。
      置いてあるのは、たたんだ布団くらいです。
      床にものがなければ、ロボットが一周するだけで床の掃除は済みます。
      ロボット掃除機、気になっているけど迷っている人いますか?
    solution: |
      これから選ぶなら、薄さとゴミ捨ての手間は見ておくといいと思います。
      Eufy C10 は高さ7.2cmの薄型で、ゴミを自動で集めるステーションも付いています。
      ソファや棚の下に入りやすいのと、ゴミ捨ての回数が減るのがいいところです。

  - code: "ueno-mono:10000006"
    name: "UENO-mono ハンディクリーナー SUIRYU"
    target: ふたり暮らし
    category: 掃除
    comment: "机の上や棚にも使える、810gのコードレスハンディ"
    pain: |
      床はロボット掃除機に任せていても、机の上や棚のほこりはそのままになりがちなんですよね。
      ロボットが届かないところほど、気づいても後回しにしてしまう。
      床以外の掃除、みなさんどうしていますか?
    solution: |
      ロボットが届かないところ用に、ハンディクリーナーを手の届く場所に置いておくと、気づいたときにすぐ吸えるんですよね。
      これは810gのコードレスで、机の上や棚の掃除にも使えます。
      床はロボット、それ以外はハンディ、と分けておくと、まとめて掃除する日をつくらなくて済みます。
