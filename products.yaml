# ===============================================
#  監視する商品リスト(ここだけ自分で編集します)
# ===============================================
# 商品を追加するには:
#   1. GitHubの「Actions」→「商品候補を探す」でキーワード検索
#   2. 結果に出た itemCode をコピーして、下の items に追記
#
# 各項目の意味:
#   code     : 楽天の商品コード(必須)「ショップ名:商品ID」の形
#   name     : 投稿で使う短い商品名(必須・30文字くらいまで)
#   target   : 一人暮らし / 家族 / 共通
#   category : ページでのグループ分け(自由に命名)
#   comment  : おすすめ理由を一言(ページに載ります。自分の言葉で!)
#   pain     : 悩みの場面と問いかけ(本投稿。リンクなしで流れます)
#              誰が・いつ・どこで・何に困って・今どうごまかしているか、を具体的に
#   solution : なぜこの商品でその悩みが解決するのか(返信に価格・リンクと一緒に載ります)
#   threshold: (任意)何%下がったら投稿するか。省略時は下の settings の値
#
# pain と solution を両方書くと「本投稿(悩み)→ 返信(解決策+【PR】リンク)」の2段構成で投稿します。
# どちらかが空なら、これまでどおり1投稿(【PR】+価格+リンク)で投稿します。
# 使っていない商品を「使ってみたら最高だった」と体験談風に書かないこと。

settings:
  drop_threshold: 15        # 30日間の通常価格から何%下がったら「買い時」とするか
  min_history_days: 5       # 判定を始めるまでに必要な価格記録の日数
  repost_cooldown_days: 7   # 同じ商品を再投稿しない日数(さらに5%以上下がれば例外)
  max_posts_per_run: 2      # 1回の実行で投稿する最大件数
  account_name: "osatow37"

items:
  # ↓記入例(実在の商品コードに置き換えてから # を外してください)
  # - code: "shopname:10000123"
  #   name: "アイリスオーヤマ 電気ケトル 1.0L"
  #   target: 一人暮らし
  #   category: キッチン家電
  #   comment: "沸騰が速くて手入れも簡単。最初の1台に"
  #   pain: |
  #     朝、温かいスープを飲みたいのに、やかんで沸かす4分が待てなくて、結局何も飲まずに家を出る。
  #     コンロの前でスマホを見ている時間がいちばんもったいない。
  #     こういう朝、ありませんか?
  #   solution: |
  #     電気ケトルならカップ1杯分が1分ちょっと。スイッチを入れて着替えている間に沸きます。
  #     火を使わないので、沸くまでその場を離れられるのが大きいです。

  # ---------------------------------------------------------------
  # テーマ: 一人暮らし(ベッドではなく布団で部屋を広く使う) × 服と布団の置き場がない × 掃除は気づいたときに少しずつ × シンプル・色をそろえる
  # 商品の仕様は、投稿前に商品ページで確認すること。
  # ---------------------------------------------------------------

  - code: "aquatalk:10000217"
    name: "日本製 布団圧縮袋 マチ付き"
    target: 一人暮らし
    category: 収納
    comment: "使わない季節の布団を小さくして、クローゼットを空ける"
    pain: |
      使うのは1年のうち数か月だけなのに、季節外の布団がクローゼットの半分を占めている。
      そのせいで服が入りきらず、部屋に出しっぱなしになる。
      布団って、しまうと場所を取りすぎませんか?
    solution: |
      季節外の布団や服は、圧縮袋に入れるとかさが大きく減ります。
      わたしも服と布団は圧縮袋でしまっていて、クローゼット1つでもなんとか収まっています。
      この袋は日本製のマチ付きで、厚みのある掛け布団にも使いやすいです。
      空気を抜くのにふつうの掃除機(300W以上)が必要なので、そこだけ注意してください。

  - code: "rackworld:10000627"
    name: "メタルラック ハンガーラック 幅91cm"
    target: 一人暮らし
    category: 収納
    comment: "入りきらない服は、色をそろえて見せる収納に"
    pain: |
      クローゼットに入りきらない服が、椅子の背もたれにかかっている。
      「とりあえず」のつもりが、気づいたら椅子が1つ服置き場になっている。
      その椅子、座れていますか?
    solution: |
      クローゼットに入らない分は、見せる収納に切り替えるのが早いです。
      ハンガーラックに服の色をそろえて掛けるだけで、散らかって見えず、部屋の一部になります。
      スチールのシンプルなラックで、色は白・黒・ブラウンから選べるので、部屋の色に合わせやすいです。

  - code: "anker:10002285"
    name: "Anker Eufy ロボット掃除機 C10"
    target: 一人暮らし
    category: 掃除
    comment: "超薄型でベッド下にも。ゴミも自動で集めてくれる"
    pain: |
      仕事から帰ると、床に髪の毛とほこりが見える。
      でも疲れていて、掃除機をかける気力が残っていない。
      見なかったことにして寝る日が、週に何回もある。
      平日に掃除する元気、ありますか?
    solution: |
      ロボット掃除機があると、床の掃除を「やる・やらない」で迷うことがなくなります。
      出かけている間に床を一周してくれるので、帰ってきたときには終わっています。
      Eufy C10 は超薄型なので、ベッドやソファの下にも入りやすく、ゴミを自動で集めるタイプなのでゴミ捨ての手間も減ります。

  - code: "ueno-mono:10000006"
    name: "UENO-mono ハンディクリーナー SUIRYU"
    target: 一人暮らし
    category: 掃除
    comment: "ロボットが届かない場所用の、手元の1台"
    pain: |
      床はロボット掃除機に任せているのに、テーブルの上や棚、窓のさんのほこりはそのまま。
      ロボットが届かない場所ほど、気づいても後回しになる。
      床以外の掃除、どうしていますか?
    solution: |
      ロボット掃除機が届かない場所用に、ハンディクリーナーを1台手元に置いておくと、気づいたときに10秒で終わります。
      床はロボット、それ以外はハンディ、と分けておくと、まとめて掃除する日がいらなくなります。
