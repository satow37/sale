  - text: |
      一人暮らしの部屋、収納がクローゼット1つしかない。
      季節外の服も、掃除機も、トイレットペーパーのストックも、全部そこに詰め込む。
      開けるたびに何かが落ちてくる。
      同じ人いますか?

  - text: |
      部屋を片付けても、3日で元に戻る。
      片付けが苦手なんじゃなくて、ものの置き場所が決まっていないだけかもしれない。
      しまう場所がないものは、結局床か机の上に戻ってくる。

  - text: |
      週末にまとめて掃除しよう、が毎週失敗する。
      土曜は疲れて寝て、日曜は出かけて、気づいたら月曜。
      掃除は「まとめて」より「ついで」のほうが続く気がしてきた。
      みんなどうやって掃除を続けていますか?

  - text: |
      ワンルームだと、出しっぱなしのものは全部インテリアの一部になる。
      掃除機も、ドライヤーも、ケトルも、隠す場所がない。
      だから家電を選ぶとき、性能と同じくらい見た目で迷う。
      狭い部屋ほど、家電の見た目って大事じゃないですか?

  - text: |
      安さで選んだ家電、ちゃんと動くのに、部屋に置くとなんだか浮いている。
      毎日目に入るものだから、その小さな違和感がずっと気になる。
      最初から好きな見た目のものを選べばよかった、と思ったことありませんか?

  - text: |
      床の髪の毛、掃除機をかけた次の日にはもう落ちている。
      一人暮らしでこれなら、毎日どれだけ抜けているんだろう。
      髪の毛の掃除、どのくらいの頻度でしていますか?

  - text: |
      玄関に靴が5足出しっぱなし。一人暮らしなのに。
      靴箱が小さくて、入りきらない分がそのまま床に並んでいる。
      帰ってきて最初に目に入るのが散らかった玄関なの、地味にへこむ。
