name: Threadsトークン更新

# Threadsのトークンは60日で切れるため、毎週月曜に延長して保存し直す
on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: トークンを延長してSecretsに保存
        env:
          OLD_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RES=$(curl -sS -G "https://graph.threads.net/refresh_access_token" \
            --data-urlencode "grant_type=th_refresh_token" \
            --data-urlencode "access_token=${OLD_TOKEN}")
          NEW=$(echo "$RES" | jq -r '.access_token // empty')
          if [ -z "$NEW" ]; then
            echo "延長に失敗しました: $(echo "$RES" | jq -c '.error // .')"
            exit 1
          fi
          echo "::add-mask::$NEW"
          gh secret set THREADS_ACCESS_TOKEN --body "$NEW" --repo "${{ github.repository }}"
          echo "更新しました(有効期限 約$(( $(echo "$RES" | jq -r '.expires_in') / 86400 ))日)"
